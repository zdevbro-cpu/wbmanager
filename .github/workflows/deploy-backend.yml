name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Write env-vars file
        working-directory: backend
        run: |
          cat > env.prod.yaml << EOF
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          GOOGLE_OAUTH_CLIENT_ID: "${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}"
          GOOGLE_OAUTH_CLIENT_SECRET: "${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}"
          GOOGLE_OAUTH_REDIRECT_URI: "${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}"
          GOOGLE_OAUTH_REFRESH_TOKEN: "${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}"
          GOOGLE_DRIVE_FOLDER_ID: "${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}"
          FIREBASE_PROJECT_ID: "${{ secrets.FIREBASE_PROJECT_ID }}"
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
          # OCR을 Vertex AI로 부른다 — 이 프로젝트 결제 계정에 후불로 달린다.
          # 값이 있으면 Vertex, 없으면 위 API 키로 되돌아간다.
          VERTEX_PROJECT_ID: "crosswb-a7083"
          VERTEX_LOCATION: "us-central1"
          EOF

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROXY }}
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 crosswb-a7083:asia-northeast3:wbmanager-db &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && break; sleep 1; done
          npx prisma migrate deploy

      - name: Deploy to Cloud Run
        working-directory: backend
        run: |
          gcloud run deploy wbmanager-api \
            --source . \
            --region asia-northeast3 \
            --allow-unauthenticated \
            --add-cloudsql-instances crosswb-a7083:asia-northeast3:wbmanager-db \
            --env-vars-file env.prod.yaml \
            --min-instances 1 \
            --quiet \
            --project crosswb-a7083

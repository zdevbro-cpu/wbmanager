<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 탭 아이콘 — 원방 마크. 16px에서는 글자가 읽히지 않아 'b' 마크만 쓴다. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="64x64" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 홈 화면에 저장하면 원방 로고가 아이콘이 된다. 현장에서는 앱처럼 열어 쓴다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b1220" />
    <!-- 화면 모드 — 그리기 전에 이 기기에서 마지막으로 쓴 모드를 먼저 입혀 번쩍임을 막는다.
         로그인 후에는 계정에 저장된 모드로 맞춘다. 출퇴근 단말은 늘 어둡게 둔다. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('wb.theme') || 'dark';
          if (location.pathname.indexOf('/attend-gate') === 0) m = 'dark';
          if (m === 'system') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (m !== 'light') m = 'dark';
          document.documentElement.setAttribute('data-theme', m);
          if (m === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WB manager" />
    <title>WB업무관리</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
